<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Chat & WebRTC Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    
    /* Video Section */
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; background: #1e1e1e; padding: 15px; border-radius: 10px; }
    video { width: 100%; height: 260px; background: #000; border-radius: 8px; object-fit: cover; }
    
    /* Control Buttons */
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { padding: 10px 16px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background: #2563eb; color: #fff; }
    button:hover { opacity: 0.9; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }
    
    /* Call Popup Modal */
    .popup { display: none; position: fixed; top: 20px; right: 20px; background: #22c55e; color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; }
    .popup.active { display: flex; align-items: center; gap: 15px; }

    /* Global Chat Section */
    .chat-box { background: #1e1e1e; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; height: 350px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
    .message { background: #2a2a2a; padding: 10px 14px; border-radius: 6px; font-size: 14px; }
    .message.call-notif { background: #3b82f6; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .chat-input { display: flex; gap: 10px; margin-top: 10px; }
    .chat-input input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>Global Chat & Direct Video Call</h2>

  <!-- Incoming Call Popup -->
  <div id="callPopup" class="popup">
    <span id="popupText">Incoming Call...</span>
    <button class="success" id="acceptCallBtn">Accept</button>
    <button class="danger" onclick="closePopup()">Reject</button>
  </div>

  <!-- Video Call Stream Section -->
  <div class="video-grid">
    <div>
      <h4>Local Video</h4>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h4>Remote Video</h4>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="controls">
      <button id="startMediaBtn">1. Enable Camera</button>
      <button id="createCallBtn" class="success">2. Start Call</button>
      <button id="endCallBtn" class="danger">End Call</button>
    </div>
  </div>

  <!-- Global Chat Section -->
  <div class="chat-box">
    <div class="chat-header">
      <h3>Global Chat (Auto-expires after 1 hour)</h3>
      <button id="wipeChatBtn" class="danger">Wipe Chat</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button id="sendMsgBtn">Send</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, doc, setDoc, getDoc, 
    onSnapshot, updateDoc, query, where, orderBy, serverTimestamp, 
    getDocs, writeBatch 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. REPLACE WITH YOUR FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // STUN servers to resolve network address traversal
  const rtcConfig = {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }
    ]
  };

  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let incomingRoomId = null;

  const localVideo = document.getElementById("localVideo");
  const remoteVideo = document.getElementById("remoteVideo");
  const chatMessages = document.getElementById("chatMessages");
  const msgInput = document.getElementById("msgInput");

  // ==========================================
  // WEBRTC CALL LOGIC (FIXES HANGING JOIN ROOM)
  // ==========================================

  // Step 1: Initialize Camera/Mic
  document.getElementById("startMediaBtn").addEventListener("click", async () => {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    remoteStream = new MediaStream();
    localVideo.srcObject = localStream;
    remoteVideo.srcObject = remoteStream;
    alert("Camera and Microphone enabled!");
  });

  // Step 2: Caller creates room
  document.getElementById("createCallBtn").addEventListener("click", async () => {
    if (!localStream) return alert("Please click '1. Enable Camera' first!");

    peerConnection = new RTCPeerConnection(rtcConfig);

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const callDocRef = doc(collection(db, "calls"));
    const offerCandidates = collection(callDocRef, "offerCandidates");
    const answerCandidates = collection(callDocRef, "answerCandidates");

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON());
    };

    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    await setDoc(callDocRef, { offer: { sdp: offerDescription.sdp, type: offerDescription.type } });

    // Send call notification in Global Chat (expires in 1 hour)
    await sendGlobalMessage(`Incoming call! Room ID: ${callDocRef.id}`, "call_notification", callDocRef.id);

    // Listen for Callee's SDP Answer
    onSnapshot(callDocRef, (snapshot) => {
      const data = snapshot.data();
      if (peerConnection && !peerConnection.currentRemoteDescription && data?.answer) {
        const answerDescription = new RTCSessionDescription(data.answer);
        peerConnection.setRemoteDescription(answerDescription);
      }
    });

    // Listen for Callee ICE Candidates
    onSnapshot(answerCandidates, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });

    alert("Call initiated! Waiting for opponent to join...");
  });

  // Step 3: Callee joins room
  async function joinCallRoom(roomId) {
    if (!localStream) {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      remoteStream = new MediaStream();
      localVideo.srcObject = localStream;
      remoteVideo.srcObject = remoteStream;
    }

    const callDocRef = doc(db, "calls", roomId);
    const callData = (await getDoc(callDocRef)).data();

    if (!callData || !callData.offer) return alert("Call room has expired or does not exist.");

    peerConnection = new RTCPeerConnection(rtcConfig);

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const offerCandidates = collection(callDocRef, "offerCandidates");
    const answerCandidates = collection(callDocRef, "answerCandidates");

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON());
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await updateDoc(callDocRef, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

    onSnapshot(offerCandidates, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });

    closePopup();
  }

  // End Call
  document.getElementById("endCallBtn").addEventListener("click", () => {
    if (peerConnection) {
      peerConnection.close();
      peerConnection = null;
    }
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    alert("Call ended.");
  });

  // ==========================================
  // CHAT & AUTO-EXPIRE LOGIC (1 HOUR)
  // ==========================================

  async function sendGlobalMessage(text, type = "chat", roomId = null) {
    const ONE_HOUR = 60 * 60 * 1000;
    const expireDate = new Date(Date.now() + ONE_HOUR);

    await addDoc(collection(db, "global_chat"), {
      text,
      type,
      roomId,
      createdAt: serverTimestamp(),
      expireAt: expireDate
    });
  }

  // Listen to Global Chat (Filters out messages older than 1 hour)
  const q = query(
    collection(db, "global_chat"),
    where("expireAt", ">=", new Date()),
    orderBy("expireAt", "asc")
  );

  onSnapshot(q, (snapshot) => {
    chatMessages.innerHTML = "";
    snapshot.docs.forEach((docSnap) => {
      const data = docSnap.data();
      const msgDiv = document.createElement("div");

      if (data.type === "call_notification") {
        msgDiv.className = "message call-notif";
        msgDiv.innerHTML = `
          <span>${data.text}</span>
          <button class="success" onclick="triggerPopup('${data.roomId}')">Join Call</button>
        `;
      } else {
        msgDiv.className = "message";
        msgDiv.textContent = data.text;
      }
      chatMessages.appendChild(msgDiv);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  // Send message button
  document.getElementById("sendMsgBtn").addEventListener("click", async () => {
    if (msgInput.value.trim() !== "") {
      await sendGlobalMessage(msgInput.value.trim());
      msgInput.value = "";
    }
  });

  // Wipe Chat Button
  document.getElementById("wipeChatBtn").addEventListener("click", async () => {
    if (confirm("Are you sure you want to wipe all global chat messages?")) {
      const querySnapshot = await getDocs(collection(db, "global_chat"));
      const batch = writeBatch(db);
      querySnapshot.forEach((d) => batch.delete(d.ref));
      await batch.commit();
    }
  });

  // ==========================================
  // POPUP CONTROLS
  // ==========================================
  window.triggerPopup = (roomId) => {
    incomingRoomId = roomId;
    document.getElementById("popupText").textContent = `Incoming Call! Room: ${roomId.substring(0, 6)}...`;
    document.getElementById("callPopup").classList.add("active");
  };

  window.closePopup = () => {
    document.getElementById("callPopup").classList.remove("active");
    incomingRoomId = null;
  };

  document.getElementById("acceptCallBtn").addEventListener("click", () => {
    if (incomingRoomId) joinCallRoom(incomingRoomId);
  });
</script>

</body>
</html>
