<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>जकेरियाचा विघ्नहर्ता - Community Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top, #800c1b 0%, #380209 100%); min-height: 100vh; }
        .chat-card { background: linear-gradient(145deg, rgba(40, 3, 7, 0.95) 0%, rgba(20, 1, 3, 0.98) 100%); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
        .scroll-smooth-ios { -webkit-overflow-scrolling: touch; }
        #chatBox::-webkit-scrollbar { width: 4px; }
        #chatBox::-webkit-scrollbar-thumb { background: rgba(212, 163, 89, 0.4); border-radius: 4px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="flex items-center justify-center p-2 sm:p-4">

    <!-- Nickname Selection Modal -->
    <div id="nicknameModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 hidden">
        <div class="chat-card border border-amber-500/40 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-amber-300 text-lg font-semibold mb-1">Enter Your Name</h2>
            <p class="text-xs text-amber-500/70 mb-4">Choose a nickname so others know who is chatting!</p>
            <input type="text" id="nicknameInput" placeholder="e.g. Rahul, Amit..." maxlength="18"
                   class="w-full bg-black/60 border border-amber-500/30 rounded-xl px-4 py-3 text-white text-center placeholder-amber-900/60 focus:outline-none focus:border-amber-400 text-sm mb-4">
            <button onclick="saveNickname()" 
                    class="w-full bg-gradient-to-r from-amber-400 to-yellow-600 text-stone-950 font-bold py-3 rounded-xl text-sm">
                Join Chat Room
            </button>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="w-full max-w-md chat-card rounded-3xl p-4 sm:p-5 border border-amber-500/30 flex flex-col h-[94vh] max-h-[850px] relative overflow-hidden">
        
        <!-- Header -->
        <div class="pb-3 border-b border-amber-500/20 flex items-center justify-between z-10">
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 class="text-amber-300 text-base sm:text-lg font-semibold tracking-wide">जकेरियाचा विघ्नहर्ता</h1>
                    <button onclick="openNicknameModal()" title="Change Nickname" class="text-amber-500/60 hover:text-amber-300 text-xs">✏️</button>
                </div>
                <p id="currentUserBadge" class="text-[11px] text-amber-500/70">Setting up...</p>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="flex items-center space-x-2 bg-black/50 px-3 py-1.5 rounded-full border border-amber-500/20">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span id="onlineCount" class="text-xs text-emerald-400 font-medium">1 Online</span>
                </div>
            </div>
        </div>

        <!-- On-Screen Debugger (Alerts if Firebase Rules are blocking access) -->
        <div id="debugBox" class="hidden bg-red-900/50 border border-red-500/50 text-red-200 text-xs p-2.5 rounded-xl my-2 text-center font-medium"></div>

        <!-- Chat Container -->
        <div id="chatBox" class="flex-1 overflow-y-auto py-4 space-y-3 pr-1 scroll-smooth-ios"></div>

        <!-- Reply Preview Banner -->
        <div id="replyPreview" class="hidden bg-black/60 border-l-2 border-amber-400 px-3 py-1.5 text-xs text-amber-200/80 flex justify-between items-center rounded-r-lg mb-1">
            <span id="replyText" class="truncate">Replying to...</span>
            <button onclick="cancelReply()" class="text-amber-500/70 hover:text-amber-300 ml-2 font-bold">✕</button>
        </div>

        <!-- Input Box -->
        <div class="pt-2 border-t border-amber-500/20 flex gap-2 z-10">
            <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off"
                   class="flex-1 bg-black/50 border border-amber-500/30 rounded-xl px-4 py-3 text-white placeholder-amber-900/50 focus:outline-none focus:border-amber-400 text-sm">
            <button onclick="sendMessage()" 
                    class="bg-gradient-to-r from-amber-400 to-yellow-600 active:scale-95 text-stone-950 font-bold px-5 py-3 rounded-xl transition text-sm flex items-center justify-center shadow-lg">
                Send
            </button>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2Otc65Q_2bZRgLsxIZTJdk9TdlL4LfmI",
            authDomain: "ultron-85fba.firebaseapp.com",
            databaseURL: "https://ultron-85fba-default-rtdb.firebaseio.com",
            projectId: "ultron-85fba",
            storageBucket: "ultron-85fba.firebasestorage.app",
            messagingSenderId: "727225448009",
            appId: "1:727225448009:web:e827bd0a819ddae42d3198",
            measurementId: "G-EEDR5XX34M"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showError(msg) {
            const box = document.getElementById('debugBox');
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        // Unique session identifier per tab/browser
        let clientId = sessionStorage.getItem('chat_client_id');
        if (!clientId) {
            clientId = 'usr_' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('chat_client_id', clientId);
        }

        let userNickname = localStorage.getItem('chat_nickname');
        if (!userNickname) {
            document.getElementById('nicknameModal').classList.remove('hidden');
        } else {
            updateUserBadge();
        }

        function openNicknameModal() {
            document.getElementById('nicknameInput').value = userNickname || '';
            document.getElementById('nicknameModal').classList.remove('hidden');
        }

        function saveNickname() {
            const val = document.getElementById('nicknameInput').value.trim();
            userNickname = val ? val : "Guest_" + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('chat_nickname', userNickname);
            document.getElementById('nicknameModal').classList.add('hidden');
            updateUserBadge();
        }

        function updateUserBadge() {
            document.getElementById('currentUserBadge').innerText = `You are: ${userNickname}`;
        }

        // Real-Time Heartbeat Tracker
        function startHeartbeat() {
            const statusRef = db.ref('/status/' + clientId);
            
            function updateStatus() {
                statusRef.set({
                    nickname: userNickname || 'Guest',
                    lastPing: Date.now()
                }).catch((err) => {
                    showError("⚠️ Database Rules Error! Please complete Step 1 to set rules to true.");
                });
            }

            updateStatus();
            setInterval(updateStatus, 4000);

            window.addEventListener('beforeunload', () => { statusRef.remove(); });

            db.ref('/status').on('value', (snapshot) => {
                const now = Date.now();
                let activeCount = 0;
                snapshot.forEach((child) => {
                    const data = child.val();
                    if (data && data.lastPing && (now - data.lastPing < 10000)) {
                        activeCount++;
                    }
                });
                document.getElementById('onlineCount').innerText = `${Math.max(1, activeCount)} Online`;
            }, (err) => {
                showError("Read Error: " + err.message);
            });
        }

        // Reply System
        let replyingTo = null;

        function setReply(sender, text) {
            replyingTo = { sender, text };
            document.getElementById('replyText').innerText = `Replying to ${sender}: "${text}"`;
            document.getElementById('replyPreview').classList.remove('hidden');
        }

        function cancelReply() {
            replyingTo = null;
            document.getElementById('replyPreview').classList.add('hidden');
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            if (!userNickname) {
                userNickname = "Guest_" + Math.floor(100 + Math.random() * 900);
                localStorage.setItem('chat_nickname', userNickname);
                updateUserBadge();
            }

            const msgData = {
                clientId: clientId,
                sender: userNickname,
                text: message,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            if (replyingTo) {
                msgData.replyTo = replyingTo;
            }

            db.ref('/messages').push(msgData).catch((err) => {
                showError("Send Failed: Check Firebase Database Rules.");
            });

            input.value = '';
            cancelReply();
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Listen for Real-Time Messages
        function listenToMessages() {
            const chatBox = document.getElementById('chatBox');
            const messagesRef = db.ref('/messages').limitToLast(60);

            messagesRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                const isMe = data.clientId === clientId;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3`;

                let replyHTML = '';
                if (data.replyTo) {
                    replyHTML = `
                        <div class="text-[10px] bg-black/40 border-l-2 border-amber-400 px-2 py-1 rounded-r mb-1 opacity-80 max-w-full truncate">
                            <span class="font-semibold text-amber-300">@${escapeHtml(data.replyTo.sender)}:</span> ${escapeHtml(data.replyTo.text)}
                        </div>
                    `;
                }

                msgDiv.innerHTML = `
                    <div class="flex items-center gap-1.5 mb-0.5 px-1">
                        <span class="text-[10px] text-amber-500/70 font-semibold">${isMe ? 'You (' + escapeHtml(data.sender) + ')' : escapeHtml(data.sender)}</span>
                    </div>
                    <div class="${isMe ? 'bg-amber-500 text-stone-950 font-medium' : 'bg-black/60 text-amber-100 border border-amber-500/20'} rounded-2xl px-3.5 py-2 max-w-[85%] text-xs shadow-md break-words relative">
                        ${replyHTML}
                        <div>${escapeHtml(data.text)}</div>
                    </div>
                    <button onclick="setReply('${escapeHtml(data.sender)}', '${escapeHtml(data.text)}')" class="text-[9px] text-amber-500/50 hover:text-amber-300 mt-0.5 px-1">
                        ↩ Reply
                    </button>
                `;

                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        startHeartbeat();
        listenToMessages();
    </script>
</body>
</html>
