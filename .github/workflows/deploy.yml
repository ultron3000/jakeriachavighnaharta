name: 🚀 Sync to InfinityFree

on:
  push:
    branches:
      - main # Change this to master if your primary branch is named master

jobs:
  web-deploy:
    name: 🎉 Deploy Changes
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftpupload.net         # Replace with your actual FTP Hostname if different
        username: if0_3xxxxxx          # Replace with your actual FTP Username
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/           # This forces files straight into InfinityFree's web folder
